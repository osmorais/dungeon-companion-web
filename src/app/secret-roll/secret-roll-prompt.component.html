@if (rollConfig(); as config) {
  <app-roll-modal
    [config]="config"
    [idCharacter]="request.id_character"
    [actorName]="actorName()"
    [sessionId]="sessionId"
    [secretRequestId]="request.request_id"
    (closed)="closed.emit()"
  />
} @else {
  <div class="secret-overlay">
    <div class="secret-panel">
      <h3 class="secret-title">
        <img class="ui-icon" src="assets/icons/padlock.png" alt="" /> TESTE SECRETO
      </h3>
      <p class="secret-hint">O mestre pediu um teste de</p>
      <p class="secret-check-name">{{ request.label }}</p>
      <p class="secret-hint">Só você e o mestre vão ver o resultado.</p>
      @if (error()) {
        <p class="secret-error">Não foi possível carregar a ficha.</p>
      }
      <div class="secret-actions">
        <button class="retro-btn secret-primary" [disabled]="loading() || error()" (click)="roll()">
          @if (!loading()) {
            <img class="ui-icon" src="assets/icons/d20.png" alt="" />
          }
          {{ loading() ? 'CARREGANDO...' : 'ROLAR' }}
        </button>
        @if (error()) {
          <button class="retro-btn" (click)="closed.emit()">FECHAR</button>
        }
      </div>
    </div>
  </div>
}
