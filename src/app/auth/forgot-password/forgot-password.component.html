@if (isMobile()) {
  <!-- ===== MOBILE LAYOUT ===== -->
  <div class="mobile-forgot-container">
    <fieldset class="mobile-forgot-panel">
      <legend>RECUPERAR ACESSO</legend>

      <div class="mobile-form-group">
        <label for="mobile-email">EMAIL</label>
        <input id="mobile-email" type="email" [(ngModel)]="email" placeholder="heroi@aventura.com" (keyup.enter)="submit()" />
      </div>

      @if (successMessage()) {
        <p class="mobile-success-msg">{{ successMessage() }}</p>
      }

      @if (errorMessage()) {
        <p class="mobile-error-msg">{{ errorMessage() }}</p>
      }

      <button class="retro-btn mobile-full-btn" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'ENVIANDO...' : 'ENVIAR' }}
      </button>

      <div class="mobile-auth-links">
        <a routerLink="/login">VOLTAR</a>
      </div>
    </fieldset>
  </div>
} @else {
  <!-- ===== DESKTOP LAYOUT ===== -->
  <div class="auth-container">
    <fieldset class="auth-panel">
      <legend>RECUPERAR ACESSO</legend>

      <div class="form-group">
        <label for="email">EMAIL</label>
        <input id="email" type="email" [(ngModel)]="email" placeholder="heroi@aventura.com" (keyup.enter)="submit()" />
      </div>

      @if (successMessage()) {
        <p class="success-msg">{{ successMessage() }}</p>
      }

      @if (errorMessage()) {
        <p class="error-msg">{{ errorMessage() }}</p>
      }

      <button class="retro-btn full-btn" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'ENVIANDO...' : 'ENVIAR' }}
      </button>

      <div class="auth-links">
        <a routerLink="/login">VOLTAR</a>
      </div>
    </fieldset>
  </div>
}
