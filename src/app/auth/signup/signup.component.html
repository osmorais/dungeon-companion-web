@if (isMobile()) {
  <!-- ===== MOBILE LAYOUT ===== -->
  <div class="mobile-signup-container">
    <fieldset class="mobile-signup-panel">
      <legend>FORJAR AVENTUREIRO</legend>

      <div class="mobile-logo-container">
        <img src="forja_arcana.png" alt="Forja Arcana" class="mobile-logo" />
      </div>

      <div class="mobile-form-group">
        <label for="mobile-username">NOME DE USUÁRIO</label>
        <input id="mobile-username" name="username" type="text" maxlength="20" autocomplete="username" spellcheck="false" [ngModel]="username()" (ngModelChange)="username.set($event)" placeholder="gorak_dente" />
        <app-username-status [username]="username()" (pick)="username.set($event)" (validChange)="usernameValid.set($event)" />
      </div>

      <div class="mobile-form-group">
        <label for="mobile-email">EMAIL</label>
        <input id="mobile-email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" [(ngModel)]="email" placeholder="heroi@aventura.com" />
      </div>

      <div class="mobile-form-group">
        <label for="mobile-password">SENHA (MÍN. 8 CARACTERES)</label>
        <input id="mobile-password" name="password" type="password" autocomplete="new-password" [(ngModel)]="password" placeholder="••••••••" />
      </div>

      <div class="mobile-form-group">
        <label for="mobile-confirmPassword">CONFIRMAR SENHA</label>
        <input id="mobile-confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" [(ngModel)]="confirmPassword" placeholder="••••••••" (keyup.enter)="submit()" />
      </div>

      <label class="mobile-terms-check">
        <input type="checkbox" class="retro-checkbox" [ngModel]="acceptedTerms()" (ngModelChange)="acceptedTerms.set($event)" />
        <span>
          Declaro ter {{ minimumAge }} anos ou mais e concordo com os
          <a [routerLink]="legalRoutes.terms" target="_blank">Termos de Uso</a> e a
          <a [routerLink]="legalRoutes.privacy" target="_blank">Política de Privacidade</a>.
        </span>
      </label>

      @if (errorMessage()) {
        <p class="mobile-error-msg" role="alert">{{ errorMessage() }}</p>
      }

      <button class="retro-btn mobile-full-btn" [class.is-loading]="loading()" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'FORJANDO...' : 'FORJAR' }}
      </button>

      @if (googleEnabled()) {
        <div class="google-separator">
          <span>OU</span>
        </div>
        <div class="google-btn-wrapper" [class.google-btn-wrapper--locked]="!acceptedTerms()">
          <div #googleBtnMobile></div>
        </div>
      }

      <div class="mobile-auth-links">
        <a routerLink="/login">JÁ SOU AVENTUREIRO</a>
        <a routerLink="/">◀ INÍCIO</a>
      </div>
    </fieldset>
  </div>
} @else {
  <!-- ===== DESKTOP LAYOUT ===== -->

    <fieldset class="auth-panel">

        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" [(ngModel)]="confirmPassword" placeholder="••••••••" (keyup.enter)="submit()" />
      </div>

      <label class="terms-check">
        <input type="checkbox" class="retro-checkbox" [ngModel]="acceptedTerms()" (ngModelChange)="acceptedTerms.set($event)" />

          Declaro ter {{ minimumAge }} anos ou mais e concordo com os

        <div class="google-btn-wrapper" [class.google-btn-wrapper--locked]="!acceptedTerms()">

      }

      <div class="auth-links">
        <a routerLink="/login">JÁ SOU AVENTUREIRO</a>
        <a routerLink="/">◀ INÍCIO</a>
      </div>
    </fieldset>
  </div>
}
