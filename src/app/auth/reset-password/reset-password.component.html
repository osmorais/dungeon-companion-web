@if (isMobile()) {
  <!-- ===== MOBILE LAYOUT ===== -->
  <div class="mobile-reset-container">
    <fieldset class="mobile-reset-panel">
      <legend>NOVA SENHA SECRETA</legend>

      <div class="mobile-form-group">
        <label for="mobile-newPassword">NOVA SENHA</label>
        <input id="mobile-newPassword" type="password" [(ngModel)]="newPassword" placeholder="••••••••" />
      </div>

      <div class="mobile-form-group">
        <label for="mobile-confirmPassword">CONFIRMAR NOVA SENHA</label>
        <input id="mobile-confirmPassword" type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" (keyup.enter)="submit()" />
      </div>

      @if (errorMessage()) {
        <p class="mobile-error-msg">{{ errorMessage() }}</p>
      }

      <button class="retro-btn mobile-full-btn" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'SALVANDO...' : 'SALVAR SENHA' }}
      </button>

      <div class="mobile-auth-links">
        <a routerLink="/login">VOLTAR AO LOGIN</a>
      </div>
    </fieldset>
  </div>
} @else {
  <!-- ===== DESKTOP LAYOUT ===== -->
  <div class="auth-container">
    <fieldset class="auth-panel">
      <legend>NOVA SENHA SECRETA</legend>

      <div class="form-group">
        <label for="newPassword">NOVA SENHA</label>
        <input id="newPassword" type="password" [(ngModel)]="newPassword" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">CONFIRMAR NOVA SENHA</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" (keyup.enter)="submit()" />
      </div>

      @if (errorMessage()) {
        <p class="error-msg">{{ errorMessage() }}</p>
      }

      <button class="retro-btn full-btn" (click)="submit()" [disabled]="loading()">
        {{ loading() ? 'SALVANDO...' : 'SALVAR SENHA' }}
      </button>

      <div class="auth-links">
        <a routerLink="/login">VOLTAR AO LOGIN</a>
      </div>
    </fieldset>
  </div>
}
