<div class="auth-container">
  <fieldset class="auth-panel">
    <legend>NOVA SENHA SECRETA</legend>

    <div class="form-group">
      <label for="newPassword">NOVA SENHA</label>
      <input id="newPassword" type="password" [(ngModel)]="newPassword" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">CONFIRMAR NOVA SENHA</label>
      <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" (keyup.enter)="submit()" />
    </div>

    @if (errorMessage()) {
      <p class="error-msg">{{ errorMessage() }}</p>
    }

    <button class="retro-btn full-btn" (click)="submit()" [disabled]="loading()">
      {{ loading() ? 'SALVANDO...' : 'SALVAR SENHA' }}
    </button>

    <div class="auth-links">
      <a routerLink="/login">VOLTAR AO LOGIN</a>
    </div>
  </fieldset>
</div>
