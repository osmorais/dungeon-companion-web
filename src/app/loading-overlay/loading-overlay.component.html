<div class="flying-dragons" aria-hidden="true">
  @for (dragon of dragons(); track dragon.id) {
    <div
      class="flying-dragon"
      [class.flying-dragon--reverse]="dragon.reverse"
      [style.top.%]="dragon.top"
      [style.width.px]="dragon.size"
      [style.height.px]="dragon.size"
      [style.animation-duration.s]="dragon.duration"
      [style.animation-delay.s]="dragon.delay"
      (animationend)="onFlightEnd(dragon)"
    >
      <div class="flying-dragon-sprite"></div>
    </div>
  }
</div>
@if (svc.visible() && svc.showMessage()) {
  <p class="loading-message" role="status">{{ svc.message() }}</p>
}
