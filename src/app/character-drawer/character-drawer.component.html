@if (!open()) {
  <button class="bottom-drawer-bar" aria-expanded="false" (click)="open.set(true)">
    <span class="bottom-drawer-arrow">▲</span>
    <img class="ui-icon" src="assets/icons/actions.png" alt="" /> AÇÕES DE PERSONAGEM
  </button>
} @else {
  <div class="bottom-drawer-backdrop" (click)="close()"></div>
  <aside class="bottom-drawer" role="dialog" aria-label="Ações de personagem">
    <button
      class="bottom-drawer-bar bottom-drawer-bar--attached"
      aria-expanded="true"
      (click)="close()"
    >
      <span class="bottom-drawer-arrow">▼</span>
      <img class="ui-icon" src="assets/icons/actions.png" alt="" /> AÇÕES DE PERSONAGEM
    </button>
    <div class="character-drawer-body">
      <p class="m-section-title">{{ characterName }}</p>
      <div class="character-drawer-grid">
        <button class="m-card" (click)="run(actions)">
          <span class="m-card-icon"
            ><img class="ui-icon" src="assets/icons/actions.png" alt=""
          /></span>
          <span class="m-card-title">AÇÕES</span>
        </button>
        @if (canEndTurn) {
          <button class="m-card m-card--highlight" [disabled]="endingTurn" (click)="run(endTurn)">
            <span class="m-card-icon"
              ><img class="ui-icon" src="assets/icons/skip-turn.png" alt=""
            /></span>
            <span class="m-card-title">{{ endingTurn ? '...' : 'FINALIZAR' }}</span>
          </button>
          @if (canDelay) {
            <button class="m-card" [disabled]="delayingTurn" (click)="run(delayTurn)">
              <span class="m-card-icon"
                ><img class="ui-icon" src="assets/icons/hourglass.png" alt=""
              /></span>
              <span class="m-card-title">{{ delayingTurn ? '...' : 'ATRASAR' }}</span>
            </button>
          }
        }
        <button class="m-card" (click)="run(sheet)">
          <span class="m-card-icon"
            ><img class="ui-icon" src="assets/icons/sheet.png" alt=""
          /></span>
          <span class="m-card-title">FICHA</span>
        </button>
        <button class="m-card" (click)="run(inventory)">
          <span class="m-card-icon"
            ><img class="ui-icon" src="assets/icons/inventory.png" alt=""
          /></span>
          <span class="m-card-title">ITENS</span>
        </button>
      </div>
    </div>
  </aside>
}
