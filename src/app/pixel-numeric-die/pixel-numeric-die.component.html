<div
  class="pixel-numeric-die"
  [style.background-image]="'url(' + imagePath + ')'"
  [class.pixel-numeric-die--mini]="mini"
  [class.pixel-numeric-die--large]="large"
  [class.pixel-numeric-die--rolling]="rolling"
  [class.pixel-numeric-die--crit-high]="!rolling && critical === 'high'"
  [class.pixel-numeric-die--crit-low]="!rolling && critical === 'low'"
  [class.pixel-numeric-die--dropped]="!rolling && dropped"
>
  <span class="pixel-numeric-die__value">{{ rolling || value === null ? '?' : value }}</span>
</div>
